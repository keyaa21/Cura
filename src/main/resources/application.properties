# =======================================================
# CURA - Clinical Management PWA Server Configuration
# =======================================================
spring.application.name=cura
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.cura.cura=DEBUG

# Spring Security & Web Configuration
spring.main.allow-bean-definition-overriding=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Firebase Admin SDK Configuration (Optional - for Cloud Firestore/Auth)
# Place your firebase-service-account.json in the project root or provide the absolute path below:
# firebase.config.path=firebase-service-account.json
# firebase.project.id=cura-clinic-pwa

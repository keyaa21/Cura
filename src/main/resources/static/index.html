<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4A7A57">
    <meta name="description" content="Cura - Local Clinic Patient Appointment & Practice Management PWA">
    <title>Cura — Clinical Care Portal</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Peachy Sage Theme Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Specific Sign-in Page Container */
        .auth-wrapper {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .auth-card {
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            max-width: 920px;
            width: 100%;
        }

        .brand-panel {
            background: linear-gradient(145deg, var(--primary-light) 0%, var(--sage-200) 50%, var(--peach-100) 100%);
            padding: 3.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        [data-theme="dark"] .brand-panel {
            background: linear-gradient(145deg, #1C2B20 0%, #28372C 50%, #352A20 100%);
        }

        .brand-logo-graphic {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--primary), var(--accent-peach));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 3rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-peach);
            animation: pulseGlow 4s infinite ease-in-out;
        }

        .form-panel {
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .auth-card {
                grid-template-columns: 1fr;
            }
            .brand-panel {
                padding: 2rem 1.5rem;
            }
            .form-panel {
                padding: 2.5rem 1.8rem;
            }
        }
    </style>
</head>
<body>

<!-- TOP NAVBAR -->
<header class="navbar">
    <div class="nav-brand">
        <div class="brand-icon-wrap"><i class="fa-solid fa-leaf"></i></div>
        <h1 class="nav-logo">CURA<span>.</span></h1>
        <span class="nav-badge">Clinic PWA</span>
    </div>
    <div class="nav-actions">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>
</header>

<!-- SIGN IN / SIGN UP AUTH WRAPPER -->
<div class="auth-wrapper">
    <div class="auth-card">

        <!-- Left Branding Panel -->
        <div class="brand-panel">
            <div class="brand-logo-graphic">
                <i class="fa-solid fa-notes-medical"></i>
            </div>
            <h2 style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.8rem; color: var(--text-primary); margin-bottom: 8px;">
                C U R A
            </h2>
            <p style="font-size: 0.95rem; color: var(--text-secondary); max-width: 260px; line-height: 1.5;">
                Holistic Patient Appointments &amp; Practice Management for Local Clinics
            </p>
            <div style="margin-top: 1.5rem; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
                <span class="followup-pill"><i class="fa-solid fa-seedling"></i> Homoeopathy</span>
                <span class="followup-pill"><i class="fa-solid fa-stethoscope"></i> Allopathy</span>
                <span class="followup-pill"><i class="fa-solid fa-brain"></i> Psychology</span>
            </div>
        </div>

        <!-- Right Form Panel -->
        <div class="form-panel">
            <div style="margin-bottom: 2rem;">
                <h2 id="form-title" style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">
                    Sign In
                </h2>
                <p id="form-subtitle" style="font-size: 0.9rem; color: var(--text-muted);">
                    Enter your credentials to access the clinic environment
                </p>
            </div>

            <form id="auth-form">
                <!-- Name Field (Hidden by default in Sign-in mode) -->
                <div class="form-group" id="name-field" style="display: none;">
                    <label for="user-name"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="user-name" class="form-control" placeholder="e.g. Keya Joshi">
                </div>

                <!-- Role Selector (Hidden in Sign-in mode) -->
                <div class="form-group" id="role-field" style="display: none;">
                    <label for="user-role"><i class="fa-solid fa-user-tag"></i> Select Portal Role</label>
                    <select id="user-role" class="form-select">
                        <option value="PATIENT">Patient (Book Appointments)</option>
                        <option value="DOCTOR">Doctor (Homoeopathy / Allopathy / Psychology)</option>
                        <option value="ASSISTANT">Clinical Assistant (Triage &amp; Vitals)</option>
                        <option value="ADMIN">Clinic Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="user-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="user-email" class="form-control" placeholder="name@clinic.com" required value="keya@example.com">
                </div>

                <div class="form-group">
                    <label for="user-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="user-password" class="form-control" placeholder="••••••••" required value="password123">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" id="submit-btn" style="flex: 1.2;">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                    </button>
                    <button type="button" class="btn btn-secondary" id="toggle-btn" style="flex: 1;">
                        Sign Up
                    </button>
                </div>

                <div style="margin-top: 1.8rem; text-align: center;">
                    <p style="font-size: 0.82rem; color: var(--text-muted);">
                        Demo Logins: <code>doctor@cura.clinic</code> &bull; <code>assistant@cura.clinic</code> &bull; <code>patient@cura.clinic</code>
                    </p>
                </div>
            </form>
        </div>

    </div>
</div>

<!-- Firebase & Core Application Scripts -->
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
